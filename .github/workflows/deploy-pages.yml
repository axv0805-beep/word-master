name: 部署 PWA 到 GitHub Pages

# 推到 main 分支即自动构建并发布，手机浏览器打开 Pages 地址后可「添加到主屏幕」，
# 以 standalone 全屏方式运行（需要 HTTPS，GitHub Pages 自带）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm run build

      - uses: actions/configure-pages@v5
        with:
          # 仓库第一次部署时自动开启 Pages（Source 选 GitHub Actions），省去手动点一次
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
