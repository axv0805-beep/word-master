name: 部署 PWA 到 GitHub Pages

# 推到 main 分支即自动构建并发布，手机浏览器打开 Pages 地址后可「添加到主屏幕」，
# 以 standalone 全屏方式运行（需要 HTTPS，GitHub Pages 自带）。

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 安卓发版工作流打完 APK 后要重新部署一次站点，但它自己用 GITHUB_TOKEN 推的提交
  # 不会触发本工作流（GitHub 的防递归规则），所以由它显式调用这里接力部署。
  workflow_call:
    inputs:
      ref:
        description: 要部署的提交或分支（默认本次触发时的提交）
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 被 android.yml 调用时要拿「刚推上去的那个提交」，而不是触发时的旧提交
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # 不用 setup-node 自带的 pnpm 缓存：它内部执行 `pnpm store` 时在本仓库会报
          # "packages field missing or empty"（pnpm 9 的参数解析问题），构建本身很快，省掉缓存即可

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm run build

      - uses: actions/configure-pages@v5
        with:
          # 仓库第一次部署时自动开启 Pages（Source 选 GitHub Actions），省去手动点一次
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
