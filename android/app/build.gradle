plugins {
  id 'com.android.application'
}

android {
  namespace 'com.cimiao.app'
  compileSdk 34

  defaultConfig {
    applicationId 'com.cimiao.app'
    minSdk 23
    targetSdk 34
    // 更新时把 versionCode +1（应用内「检查更新」用它和站点上的 version.json 比较）
    versionCode 20
    versionName '1.1.18'
  }

  // 可选的自定义签名（不要提交 keystore.properties 和 .jks，已在 .gitignore 里）：
  //   storeFile=keystore.jks        # 相对 android/ 目录
  //   storePassword=...
  //   keyAlias=...
  //   keyPassword=...
  // 有它就用它替换默认的 debug 签名——本地和 CI 用同一把钥匙，覆盖安装才不会因为
  // 签名不一致失败；没有它时退回 AGP 默认的 ~/.android/debug.keystore。
  def keystorePropsFile = rootProject.file('keystore.properties')
  def keystoreProps = new Properties()
  if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
  }

  signingConfigs {
    debug {
      if (keystoreProps.containsKey('storeFile')) {
        storeFile rootProject.file(keystoreProps['storeFile'])
        storePassword keystoreProps['storePassword']
        keyAlias keystoreProps['keyAlias']
        keyPassword keystoreProps['keyPassword']
      }
    }
  }

  buildTypes {
    debug {
      signingConfig signingConfigs.debug
    }
    release {
      minifyEnabled false
      signingConfig signingConfigs.debug
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  // WebViewAssetLoader：把打包进 assets 的前端当 https:// 站点加载，避开 file:// 的 CORS 限制
  implementation 'androidx.webkit:webkit:1.11.0'
  // WindowCompat / WindowInsetsControllerCompat：状态栏透明化与图标明暗随主题切换
  implementation 'androidx.core:core:1.13.1'
}
