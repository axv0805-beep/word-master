plugins {
  id 'com.android.application'
}

android {
  namespace 'com.cimiao.app'
  compileSdk 34

  defaultConfig {
    applicationId 'com.cimiao.app'
    minSdk 23
    targetSdk 34
    // 更新时把 versionCode +1（应用内「检查更新」用它和站点上的 version.json 比较）
    versionCode 4
    versionName '1.1.2'
  }

  buildTypes {
    debug {
      signingConfig signingConfigs.debug
    }
    release {
      minifyEnabled false
      signingConfig signingConfigs.debug
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  // WebViewAssetLoader：把打包进 assets 的前端当 https:// 站点加载，避开 file:// 的 CORS 限制
  implementation 'androidx.webkit:webkit:1.11.0'
}
