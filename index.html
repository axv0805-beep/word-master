<!doctype html>
<html lang="zh-CN" data-theme="forest">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 记录首帧时间，开屏至少停留这么久，避免一闪而过更显突兀
      window.__bootAt = performance.now()
      // 首帧前套用存档里的主题，避免浅色用户看到一瞬深色底
      ;(function () {
        try {
          var raw = localStorage.getItem('word-master-store')
          var theme = raw ? JSON.parse(raw).state.settings.theme : 'forest'
          var light = { forest: 1, light: 1, sakura: 1, ocean: 1 }
          document.documentElement.setAttribute('data-theme', theme || 'forest')
          document.documentElement.classList.toggle('dark', !light[theme])
        } catch (error) {
          /* 存档损坏时保持默认主题 */
        }
      })()
    </script>
    <style>
      /* ============================================================
         开屏：样式内联在 document 里，不依赖 JS 包和 index.css，
         首帧就能画出来，避免「白屏一下再进入」的生硬感。
         底色按 data-theme 走，和当时的主题一致；由 src/core/boot.ts
         在应用挂载后加 .is-leaving 淡出并移除。
         ============================================================ */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #f1faf3;
        color: #0a2718;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
        transition:
          opacity 320ms ease,
          transform 420ms cubic-bezier(0.4, 0, 0.2, 1);
        will-change: opacity, transform;
      }

      /* 每个主题一套底色，和 index.css 的 --bg 对齐 */
      html[data-theme='light'] #boot-splash {
        background: #f3f4fc;
      }
      html[data-theme='sakura'] #boot-splash {
        background: #fff5f8;
      }
      html[data-theme='ocean'] #boot-splash {
        background: #f1f8fa;
      }
      html[data-theme='dark'] #boot-splash {
        background: #070b18;
        color: #f2fbf6;
      }
      html[data-theme='aurora'] #boot-splash {
        background: #04120f;
        color: #f2fbf6;
      }
      html[data-theme='sunset'] #boot-splash {
        background: #140a06;
        color: #f2fbf6;
      }

      /* 让位：整体淡出并轻微放大，像把封面掀开 */
      #boot-splash.is-leaving {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }

      .boot-glow {
        position: absolute;
        top: -16vh;
        left: 50%;
        width: min(120vw, 640px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(16, 185, 129, 0.24), rgba(16, 185, 129, 0) 72%);
        /* 位移写在基础样式里：减少动效关掉 animation 后也要居中 */
        transform: translateX(-50%);
        animation: boot-glow 1400ms ease-out both;
      }
      html.dark .boot-glow {
        background: radial-gradient(closest-side, rgba(45, 212, 191, 0.22), rgba(45, 212, 191, 0) 72%);
      }

      .boot-mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 96px;
        height: 96px;
      }

      .boot-mark img {
        width: 96px;
        height: 96px;
        border-radius: 27px;
        box-shadow: 0 20px 44px -20px rgba(6, 78, 45, 0.45);
        animation: boot-mark 760ms cubic-bezier(0.2, 0.9, 0.3, 1.06) both;
      }
      html.dark .boot-mark img {
        box-shadow: 0 20px 44px -16px rgba(0, 0, 0, 0.72);
      }

      /* 一圈很淡的扩散，呼应首页顶部的弧形光 */
      .boot-ring {
        position: absolute;
        inset: -16px;
        border: 1px solid rgba(5, 150, 105, 0.34);
        border-radius: 40px;
        animation: boot-ring 2200ms cubic-bezier(0.25, 0.6, 0.35, 1) 220ms infinite;
      }
      html.dark .boot-ring {
        border-color: rgba(125, 232, 205, 0.3);
      }

      .boot-name {
        margin: 28px 0 0;
        font-size: 26px;
        font-weight: 700;
        line-height: 1.2;
        animation: boot-name 620ms cubic-bezier(0.22, 0.9, 0.28, 1) 160ms both;
      }

      .boot-slogan {
        margin: 10px 0 0;
        font-size: 13px;
        letter-spacing: 0.18em;
        text-indent: 0.18em;
        color: rgba(10, 39, 24, 0.55);
        animation: boot-fade 560ms ease-out 340ms both;
      }
      html.dark .boot-slogan {
        color: rgba(242, 251, 246, 0.58);
      }

      /* 一根渐显的品牌细线，给「正在准备」一点可看的变化 */
      .boot-line {
        position: absolute;
        left: 50%;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 68px);
        width: 132px;
        height: 2px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(5, 150, 105, 0.14);
        transform: translateX(-50%);
      }
      .boot-line i {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, #047857, #4d7c0f);
        transform: scaleX(0);
        transform-origin: left center;
        animation: boot-line 900ms cubic-bezier(0.35, 0, 0.25, 1) 120ms forwards;
      }
      html.dark .boot-line {
        background: rgba(255, 255, 255, 0.12);
      }

      @keyframes boot-glow {
        from {
          opacity: 0;
          transform: translateX(-50%) scale(0.72);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) scale(1);
        }
      }
      @keyframes boot-mark {
        from {
          opacity: 0;
          transform: scale(0.82) rotate(-8deg);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes boot-ring {
        0% {
          opacity: 0;
          transform: scale(0.92);
        }
        25% {
          opacity: 0.55;
        }
        100% {
          opacity: 0;
          transform: scale(1.42);
        }
      }
      @keyframes boot-name {
        from {
          opacity: 0;
          letter-spacing: 0.32em;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          letter-spacing: 0.08em;
          transform: none;
        }
      }
      @keyframes boot-fade {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes boot-line {
        to {
          transform: scaleX(1);
        }
      }

      /* 减少动效：只留最短的淡出，不做缩放和循环扩散 */
      @media (prefers-reduced-motion: reduce) {
        #boot-splash,
        #boot-splash .boot-mark img,
        #boot-splash .boot-name,
        #boot-splash .boot-slogan,
        #boot-splash .boot-glow,
        #boot-splash .boot-line i {
          animation: none !important;
        }
        #boot-splash {
          transition: opacity 160ms linear;
        }
        #boot-splash .boot-ring {
          display: none;
        }
        #boot-splash .boot-line i {
          transform: scaleX(1);
        }
      }
    </style>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F1FAF3" />
    <meta name="description" content="词芽 · 手机优先的背单词应用：字母顺序背词、随机抽词、错题专项练习、成长曲线" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="词芽" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/x-icon" href="./icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <title>词芽 · 背单词</title>
  </head>
  <body>
    <!-- 开屏标记也内联：JS 还没执行完之前，用户看到的就是这一屏 -->
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-glow"></div>
      <div class="boot-mark">
        <span class="boot-ring"></span>
        <img src="./icons/logo-512.png" alt="" width="96" height="96" />
      </div>
      <p class="boot-name">词芽</p>
      <p class="boot-slogan">每天一点，长成一片</p>
      <span class="boot-line"><i></i></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
