<!doctype html>
<html lang="zh-CN" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 首帧前套用存档里的主题，避免浅色用户看到一瞬深色底
      ;(function () {
        try {
          var raw = localStorage.getItem('word-master-store')
          var theme = raw ? JSON.parse(raw).state.settings.theme : 'dark'
          var light = { light: 1, sakura: 1, ocean: 1 }
          document.documentElement.setAttribute('data-theme', theme || 'dark')
          document.documentElement.classList.toggle('dark', !light[theme])
        } catch (error) {
          /* 存档损坏时保持默认深色 */
        }
      })()
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070B18" />
    <meta name="description" content="单词王 · 手机优先的背单词应用：字母顺序背词、随机抽词、错题专项练习、成长曲线" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>单词王 · 背单词</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
