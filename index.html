<!doctype html>
<html lang="zh-CN" data-theme="forest">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 首帧前套用存档里的主题，避免浅色用户看到一瞬深色底
      ;(function () {
        try {
          var raw = localStorage.getItem('word-master-store')
          var theme = raw ? JSON.parse(raw).state.settings.theme : 'forest'
          var light = { forest: 1, light: 1, sakura: 1, ocean: 1 }
          document.documentElement.setAttribute('data-theme', theme || 'forest')
          document.documentElement.classList.toggle('dark', !light[theme])
        } catch (error) {
          /* 存档损坏时保持默认主题 */
        }
      })()
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F1FAF3" />
    <meta name="description" content="词芽 · 手机优先的背单词应用：字母顺序背词、随机抽词、错题专项练习、成长曲线" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="词芽" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/x-icon" href="./icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <title>词芽 · 背单词</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
